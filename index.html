<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Stars Mini App Game</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @keyframes pulse-glow {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 15px rgba(234, 179, 8, 0.6)); }
            50% { transform: scale(1.08); filter: drop-shadow(0 0 30px rgba(234, 179, 8, 0.9)); }
        }
        .star-btn { animation: pulse-glow 2s infinite; }
    </style>
</head>
<body class="bg-slate-950 text-white font-sans select-none flex flex-col h-screen overflow-hidden">

    <!-- Yuqori qism (Profil va Balans) -->
    <header class="flex justify-between items-center p-4 bg-slate-900/80 border-b border-slate-800 backdrop-blur">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-amber-500/20 border border-amber-500 flex items-center justify-center text-xl font-bold text-amber-400" id="user-avatar">⭐</div>
            <div>
                <h1 id="username" class="font-bold text-sm">O'yinchi</h1>
                <p class="text-xs text-amber-400">Daraja: <span id="user-level">1</span></p>
            </div>
        </div>
        <div class="flex items-center gap-2 bg-slate-800/90 px-3 py-1.5 rounded-full border border-amber-500/30">
            <span class="text-xl">⭐</span>
            <span id="star-balance" class="font-black text-amber-400 text-lg">120</span>
        </div>
    </header>

    <!-- Asosiy oyna (Tabs) -->
    <main class="flex-1 overflow-y-auto p-4 pb-24 flex flex-col items-center justify-center">
        
        <!-- 1. Tapper Tab -->
        <div id="tab-game" class="tab-content flex flex-col items-center justify-center w-full">
            <div class="text-center mb-6">
                <p class="text-xs text-slate-400 uppercase tracking-widest">Yulduzchani bosing</p>
                <h2 class="text-3xl font-black mt-1" id="tap-score">120</h2>
            </div>

            <!-- Markaziy yulduz -->
            <div class="relative my-8 cursor-pointer" onclick="tapStar(event)">
                <div class="w-48 h-48 rounded-full bg-gradient-to-tr from-amber-600 to-amber-300 flex items-center justify-center shadow-2xl star-btn transition-transform active:scale-95">
                    <span class="text-7xl">⭐</span>
                </div>
            </div>

            <!-- Energiya paneli -->
            <div class="w-full max-w-xs bg-slate-900 rounded-full h-4 p-0.5 border border-slate-800 mt-4">
                <div id="energy-bar" class="bg-gradient-to-r from-amber-500 to-yellow-300 h-full rounded-full transition-all duration-300" style="width: 100%;"></div>
            </div>
            <p class="text-xs text-slate-400 mt-2"><span id="energy-count">100</span> / 100 Energiya</p>
        </div>

        <!-- 2. Casino / Wager Tab -->
        <div id="tab-casino" class="tab-content hidden w-full max-w-sm text-center">
            <h2 class="text-xl font-bold mb-4 text-amber-400">🎰 Yulduz Tikish (Wager)</h2>
            <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800 shadow-xl mb-4">
                <div class="flex justify-around text-4xl py-6 bg-slate-950 rounded-xl mb-4 border border-slate-800">
                    <span id="slot-1">⭐</span>
                    <span id="slot-2">⭐</span>
                    <span id="slot-3">⭐</span>
                </div>
                <button onclick="playSlot()" class="w-full py-3 bg-amber-500 hover:bg-amber-400 text-slate-950 font-black rounded-xl text-lg shadow-lg transition active:scale-95">O'ynash (Tikish: 25 ⭐)</button>
            </div>
        </div>

        <!-- 3. Tasks Tab -->
        <div id="tab-tasks" class="tab-content hidden w-full max-w-sm">
            <h2 class="text-xl font-bold mb-4 text-amber-400">📋 Kunlik Vazifalar</h2>
            <div class="space-y-3">
                <div class="bg-slate-900 p-4 rounded-xl border border-slate-800 flex justify-between items-center">
                    <div>
                        <h4 class="font-bold text-sm">Botga do'st taklif qilish</h4>
                        <p class="text-xs text-amber-400">+200 ⭐ Yulduz</p>
                    </div>
                    <button onclick="completeTask(200, this)" class="px-4 py-2 bg-amber-500/20 text-amber-400 border border-amber-500/50 rounded-lg text-xs font-bold hover:bg-amber-500 hover:text-slate-950 transition">Bajarish</button>
                </div>
            </div>
        </div>

        <!-- 4. Withdraw Tab -->
        <div id="tab-withdraw" class="tab-content hidden w-full max-w-sm text-center">
            <h2 class="text-xl font-bold mb-2 text-amber-400">💸 Yulduzlarni Yechish</h2>
            <p class="text-xs text-slate-400 mb-6">Yechib olish uchun minimal miqdor: 1,000 ⭐</p>
            
            <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800 text-left">
                <div class="mb-4">
                    <div class="flex justify-between text-xs mb-1">
                        <span>Jarayon</span>
                        <span id="withdraw-progress-text">12%</span>
                    </div>
                    <div class="w-full bg-slate-950 rounded-full h-2">
                        <div id="withdraw-bar" class="bg-amber-500 h-2 rounded-full" style="width: 12%;"></div>
                    </div>
                </div>
                <input type="text" placeholder="Telegram Wallet ID yoki Kripto hamyon" class="w-full p-3 bg-slate-950 border border-slate-800 rounded-xl text-sm mb-3 focus:outline-none focus:border-amber-500">
                <button onclick="requestWithdraw()" class="w-full py-3 bg-amber-500 text-slate-950 font-bold rounded-xl text-sm">Yechib olishni so'rash</button>
            </div>
        </div>

    </main>

    <!-- Pastki Menyu (Navigation) -->
    <nav class="absolute bottom-0 left-0 right-0 bg-slate-900/95 border-t border-slate-800 flex justify-around p-3 backdrop-blur">
        <button onclick="switchTab('game')" class="flex flex-col items-center text-amber-400 nav-btn" data-tab="game">
            <span class="text-xl">🕹️</span>
            <span class="text-[10px] mt-1 font-bold">O'yin</span>
        </button>
        <button onclick="switchTab('casino')" class="flex flex-col items-center text-slate-400 nav-btn" data-tab="casino">
            <span class="text-xl">🎰</span>
            <span class="text-[10px] mt-1">Kazino</span>
        </button>
        <button onclick="switchTab('tasks')" class="flex flex-col items-center text-slate-400 nav-btn" data-tab="tasks">
            <span class="text-[10px] mt-1">📋</span>
            <span class="text-[10px] mt-1">Vazifalar</span>
        </button>
        <button onclick="switchTab('withdraw')" class="flex flex-col items-center text-slate-400 nav-btn" data-tab="withdraw">
            <span class="text-xl">💸</span>
            <span class="text-[10px] mt-1">Yechish</span>
        </button>
    </nav>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let balance = 120;
        let energy = 100;
        let maxEnergy = 100;

        // Telegram foydalanuvchi ma'lumotlari
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('username').innerText = tg.initDataUnsafe.user.first_name;
        }

        function updateUI() {
            document.getElementById('star-balance').innerText = balance;
            document.getElementById('tap-score').innerText = balance;
            document.getElementById('energy-count').innerText = energy;
            document.getElementById('energy-bar').style.width = (energy / maxEnergy) * 100 + '%';
            
            let progress = Math.min(100, Math.floor((balance / 1000) * 100));
            document.getElementById('withdraw-bar').style.width = progress + '%';
            document.getElementById('withdraw-progress-text').innerText = progress + '%';
        }

        function tapStar(event) {
            if (energy > 0) {
                balance += 1;
                energy -= 1;
                updateUI();
                if (tg.HapticFeedback) {
                    tg.HapticFeedback.impactOccurred('medium');
                }
            }
        }

        // Energiya tiklanishi
        setInterval(() => {
            if (energy < maxEnergy) {
                energy += 1;
                updateUI();
            }
        }, 2000);

        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById('tab-' + tabName).classList.remove('hidden');
            
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('text-amber-400'));
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.add('text-slate-400'));
            event.currentTarget.classList.remove('text-slate-400');
            event.currentTarget.classList.add('text-amber-400');
        }

        function playSlot() {
            if (balance >= 25) {
                balance -= 25;
                let items = ['⭐', '💎', '🚀', '🎁'];
                let s1 = items[Math.floor(Math.random() * items.length)];
                let s2 = items[Math.floor(Math.random() * items.length)];
                let s3 = items[Math.floor(Math.random() * items.length)];
                
                document.getElementById('slot-1').innerText = s1;
                document.getElementById('slot-2').innerText = s2;
                document.getElementById('slot-3').innerText = s3;

                if (s1 === s2 && s2 === s3) {
                    balance += 100;
                    alert("Tabriklayman! 100 ta yulduz yutib oldingiz!");
                }
                updateUI();
            } else {
                alert("Balansingizda yulduzlar yetarli emas!");
            }
        }

        function completeTask(reward, btn) {
            balance += reward;
            btn.innerText = "Bajarildi";
            btn.disabled = true;
            btn.classList.add('opacity-50');
            updateUI();
            alert("Tabriklayman! " + reward + " ta yulduz qo'shildi.");
        }

        function requestWithdraw() {
            if (balance >= 1000) {
                alert("So'rovingiz qabul qilindi! Admin tez orada ko'rib chiqadi.");
            } else {
                alert("1,000 ta yulduz yig'ishingiz kerak!");
            }
        }

        updateUI();
    </script>
</body>
</html>
